<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Keçiören Gece Kokoreççisi</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: #111;
            color: #fff;
            min-height: 100vh;
        }
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            color: #D4A017;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #D4A017, #B8860B);
            color: #111;
        }
        .btn-danger {
            background: #C41E3A;
            color: #fff;
        }
        .btn-secondary {
            background: #2a2a2a;
            color: #fff;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .tab {
            padding: 12px 25px;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .tab.active {
            background: #D4A017;
            color: #111;
            border-color: #D4A017;
        }
        .content-section {
            display: none;
        }
        .content-section.active {
            display: block;
        }
        .card {
            background: #1e1e1e;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
        }
        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #aaa;
            font-size: 0.9rem;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            background: #2a2a2a;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
        }
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #D4A017;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .product-card {
            background: #2a2a2a;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #333;
        }
        .product-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }
        .product-info {
            padding: 15px;
        }
        .product-info h3 {
            color: #D4A017;
            margin-bottom: 8px;
        }
        .product-info p {
            color: #aaa;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }
        .product-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .product-actions button {
            flex: 1;
            padding: 8px;
            font-size: 0.9rem;
        }
        .category-tag {
            display: inline-block;
            background: #D4A017;
            color: #111;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-right: 5px;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #D4A017;
        }
        #imagePreview {
            max-width: 200px;
            max-height: 150px;
            margin-top: 10px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="header">
            <h1>🥙 Admin Panel</h1>
            <div>
                <span id="userEmail" style="margin-right: 15px; color: #aaa;"></span>
                <button class="btn btn-secondary" onclick="logout()">Çıkış Yap</button>
            </div>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('products')">🍽️ Ürünler</div>
            <div class="tab" onclick="switchTab('categories')">📁 Kategoriler</div>
            <div class="tab" onclick="switchTab('users')">👥 Kullanıcılar</div>
        </div>

        <!-- ÜRÜNLER -->
        <div class="content-section active" id="products-section">
            <div class="card">
                <h2 style="color: #D4A017; margin-bottom: 20px;">Yeni Ürün Ekle</h2>
                <form id="productForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Ürün Adı</label>
                            <input type="text" id="productName" required>
                        </div>
                        <div class="form-group">
                            <label>Kategori</label>
                            <select id="productCategory" required>
                                <option value="">Seçin...</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Fiyat (TL)</label>
                            <input type="number" id="productPrice" required>
                        </div>
                        <div class="form-group">
                            <label>Kalori (kcal)</label>
                            <input type="number" id="productCalories">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Açıklama</label>
                        <textarea id="productDescription" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label>İçerik (Bileşenler)</label>
                        <textarea id="productIngredients" rows="2"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Alerjenler (virgülle ayırın)</label>
                        <input type="text" id="productAllergens" placeholder="Gluten, Süt, Yumurta">
                    </div>
                    <div class="form-group">
                        <label>Ürün Görseli</label>
                        <input type="file" id="productImage" accept="image/*">
                        <img id="imagePreview" style="display:none;">
                    </div>
                    <button type="submit" class="btn btn-primary">Ürünü Kaydet</button>
                </form>
            </div>

            <div class="card">
                <h2 style="color: #D4A017; margin-bottom: 20px;">Mevcut Ürünler</h2>
                <div id="productsList" class="products-grid">
                    <div class="loading">Yükleniyor...</div>
                </div>
            </div>
        </div>

        <!-- KATEGORİLER -->
        <div class="content-section" id="categories-section">
            <div class="card">
                <h2 style="color: #D4A017; margin-bottom: 20px;">Yeni Kategori Ekle</h2>
                <form id="categoryForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Kategori Adı</label>
                            <input type="text" id="categoryName" required>
                        </div>
                        <div class="form-group">
                            <label>Emoji/İkon</label>
                            <input type="text" id="categoryIcon" placeholder="🥙" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Kategoriyi Ekle</button>
                </form>
            </div>

            <div class="card">
                <h2 style="color: #D4A017; margin-bottom: 20px;">Mevcut Kategoriler</h2>
                <div id="categoriesList"></div>
            </div>
        </div>

        <!-- KULLANICILAR -->
        <div class="content-section" id="users-section">
            <div class="card">
                <h2 style="color: #D4A017; margin-bottom: 20px;">Kullanıcı Yönetimi</h2>
                <div id="usersList"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth } from './firebase.js';
        import { db } from './firebase.js';
        import { storage } from './firebase.js';
        import { signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { 
            collection, 
            addDoc, 
            getDocs, 
            deleteDoc, 
            doc, 
            updateDoc,
            query,
            where
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { ref, uploadBytes, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        let currentUser = null;

        // Yetki kontrolü
        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = 'auth.html';
                return;
            }
            
            currentUser = user;
            document.getElementById('userEmail').textContent = user.email;
            
            // Admin kontrolü
            const userDoc = await getDocs(query(collection(db, "users"), where("__name__", "==", user.uid)));
            if (userDoc.empty || userDoc.docs[0].data().role !== "admin") {
                alert('Bu sayfaya erişim yetkiniz yok!');
                window.location.href = 'index.html';
                return;
            }

            loadCategories();
            loadProducts();
            loadUsers();
        });

        window.logout = async function() {
            await signOut(auth);
            window.location.href = 'auth.html';
        }

        window.switchTab = function(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            document.getElementById(`${tab}-section`).classList.add('active');
        }

        // Kategori işlemleri
        async function loadCategories() {
            const querySnapshot = await getDocs(collection(db, "categories"));
            const select = document.getElementById('productCategory');
            const list = document.getElementById('categoriesList');
            
            select.innerHTML = '<option value="">Seçin...</option>';
            list.innerHTML = '';
            
            querySnapshot.forEach((doc) => {
                const data = doc.data();
                select.innerHTML += `<option value="${doc.id}">${data.icon} ${data.name}</option>`;
                
                list.innerHTML += `
                    <div style="display:flex;justify-content:space-between;align-items:center;padding:10px;background:#2a2a2a;border-radius:8px;margin-bottom:10px;">
                        <span>${data.icon} ${data.name}</span>
                        <button class="btn btn-danger" onclick="deleteCategory('${doc.id}')">Sil</button>
                    </div>
                `;
            });
        }

        document.getElementById('categoryForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('categoryName').value;
            const icon = document.getElementById('categoryIcon').value;

            try {
                await addDoc(collection(db, "categories"), {
                    name: name,
                    icon: icon,
                    createdAt: new Date().toISOString()
                });
                
                alert('Kategori eklendi!');
                e.target.reset();
                loadCategories();
            } catch (error) {
                alert('Hata: ' + error.message);
            }
        });

        window.deleteCategory = async function(id) {
            if (!confirm('Bu kategoriyi silmek istediğinize emin misiniz?')) return;
            
            try {
                await deleteDoc(doc(db, "categories", id));
                loadCategories();
            } catch (error) {
                alert('Hata: ' + error.message);
            }
        }

        // Ürün işlemleri
        async function loadProducts() {
            const querySnapshot = await getDocs(collection(db, "products"));
            const list = document.getElementById('productsList');
            
            if (querySnapshot.empty) {
                list.innerHTML = '<p style="color:#aaa;">Henüz ürün eklenmemiş.</p>';
                return;
            }
            
            list.innerHTML = '';
            querySnapshot.forEach((doc) => {
                const data = doc.data();
                list.innerHTML += `
                    <div class="product-card">
                        ${data.imageUrl ? `<img src="${data.imageUrl}" alt="${data.name}">` : ''}
                        <div class="product-info">
                            <h3>${data.name}</h3>
                            <p><strong>Fiyat:</strong> ${data.price} TL</p>
                            <p><strong>Kalori:</strong> ${data.calories || '-'} kcal</p>
                            <p>${data.description || ''}</p>
                            <div class="product-actions">
                                <button class="btn btn-danger" onclick="deleteProduct('${doc.id}', '${data.imageUrl || ''}')">Sil</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

       // ImgBB API
const IMGBB_API_KEY = '4e4b620b0043a12eb15ad7f823e51cda';
let uploadedImageUrl = '';

// Görsel seçildiğinde ImgBB'ye yükle
document.getElementById('productImage').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    
    const preview = document.getElementById('imagePreview');
    
    // Önizleme
    const reader = new FileReader();
    reader.onload = (event) => {
        preview.src = event.target.result;
        preview.style.display = 'block';
    };
    reader.readAsDataURL(file);
    
    // ImgBB'ye yükle
    try {
        const formData = new FormData();
        formData.append('key', IMGBB_API_KEY);
        formData.append('image', file);
        
        const response = await fetch('https://api.imgbb.com/1/upload', {
            method: 'POST',
            body: formData
        });
        
        const data = await response.json();
        
        if (data.success) {
            uploadedImageUrl = data.data.display_url;
            console.log('Görsel yüklendi:', uploadedImageUrl);
        } else {
            alert('Görsel yükleme başarısız!');
        }
    } catch (error) {
        alert('Hata: ' + error.message);
    }
});

        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // imageUrl artık uploadedImageUrl değişkeninden gelecek

            const allergens = document.getElementById('productAllergens').value
                .split(',')
                .map(a => a.trim())
                .filter(a => a);

            try {
                await addDoc(collection(db, "products"), {
                    name: document.getElementById('productName').value,
                    category: document.getElementById('productCategory').value,
                    price: parseFloat(document.getElementById('productPrice').value),
                    calories: parseInt(document.getElementById('productCalories').value) || 0,
                    description: document.getElementById('productDescription').value,
                    ingredients: document.getElementById('productIngredients').value,
                    allergens: allergens,
                    imageUrl: uploadedImageUrl || '',
                    createdAt: new Date().toISOString()
                });
                
                alert('Ürün eklendi!');
                e.target.reset();
                document.getElementById('imagePreview').style.display = 'none';
                loadProducts();
            } catch (error) {
                alert('Hata: ' + error.message);
            }
        });

        window.deleteProduct = async function(id, imageUrl) {
            if (!confirm('Bu ürünü silmek istediğinize emin misiniz?')) return;
            
            try {
                if (imageUrl) {
                    const imageRef = ref(storage, imageUrl);
                    await deleteObject(imageRef);
                }
                await deleteDoc(doc(db, "products", id));
                loadProducts();
            } catch (error) {
                alert('Hata: ' + error.message);
            }
        }

        // Kullanıcı yönetimi
        async function loadUsers() {
            const querySnapshot = await getDocs(collection(db, "users"));
            const list = document.getElementById('usersList');
            
            list.innerHTML = '';
            querySnapshot.forEach((doc) => {
                const data = doc.data();
                list.innerHTML += `
                    <div style="display:flex;justify-content:space-between;align-items:center;padding:15px;background:#2a2a2a;border-radius:8px;margin-bottom:10px;">
                        <div>
                            <strong>${data.name}</strong><br>
                            <small style="color:#aaa;">${data.email}</small><br>
                            <span class="category-tag">${data.role}</span>
                        </div>
                        <div>
                            ${data.role === 'admin' ? 
                                `<button class="btn btn-secondary" onclick="setUserRole('${doc.id}', 'user')">Kullanıcı Yap</button>` :
                                `<button class="btn btn-primary" onclick="setUserRole('${doc.id}', 'admin')">Admin Yap</button>`
                            }
                        </div>
                    </div>
                `;
            });
        }

        window.setUserRole = async function(userId, role) {
            try {
                await updateDoc(doc(db, "users", userId), { role: role });
                loadUsers();
                alert('Rol güncellendi!');
            } catch (error) {
                alert('Hata: ' + error.message);
            }
        }
    </script>

        <div class="edit-modal-footer">
            <button class="edit-cancel-btn" onclick="closeEditModal()">İptal</button>
            <button class="edit-save-btn" id="editSaveBtn" onclick="saveEdit()">
                <i class="fas fa-save"></i> Kaydet
            </button>
        </div>
    </div>
</div>

<!-- Mesaj -->
<div class="admin-success-msg" id="adminSuccessMsg">
    <i class="fas fa-check-circle"></i> <span id="adminMsgText">Kaydedildi!</span>
</div>

<script>
    // ============ FIREBASE YAPILANDIRMASI ============
    const firebaseConfig = {
        apiKey: "AIzaSyC5iB_kvS8z0truk90ir6vDatIskewz0mU",
        authDomain: "goldoner-6682a.firebaseapp.com",
        databaseURL: "https://goldoner-6682a-default-rtdb.firebaseio.com",
        projectId: "goldoner-6682a",
        storageBucket: "goldoner-6682a.firebasestorage.app",
        messagingSenderId: "397837198552",
        appId: "1:397837198552:web:bc83c9f482242d588f63ad",
        measurementId: "G-QFYWkW8X22"
    };

    const ADMIN_PASSWORD = "Soner5877";
    let isAdminLoggedIn = false;
    let currentEditType = '';
    let currentEditData = {};

    // Firestore başlat
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const categoriesRef = db.collection('categories');
    const productsRef = db.collection('products');

    // ============ LOGIN ============
    function openLoginModal() {
        if (isAdminLoggedIn) {
            openAdminPanel();
        } else {
            document.getElementById('loginModal').classList.add('active');
            document.getElementById('adminPassword').focus();
        }
    }

    function loginAdmin() {
        const password = document.getElementById('adminPassword').value;
        if (password === ADMIN_PASSWORD) {
            isAdminLoggedIn = true;
            document.getElementById('loginModal').classList.remove('active');
            document.getElementById('adminPassword').value = '';
            openAdminPanel();
            showMessage('Giriş başarılı!', 'success');
        } else {
            showMessage('Hatalı şifre!', 'error');
        }
    }

    function logoutAdmin() {
        isAdminLoggedIn = false;
        closeAdminPanel();
        showMessage('Çıkış yapıldı', 'success');
    }

    // ============ ADMIN PANEL ============
    function openAdminPanel() {
        document.getElementById('adminModal').classList.add('active');
        loadAdminData();
    }

    function closeAdminPanel() {
        document.getElementById('adminModal').classList.remove('active');
    }

    async function loadAdminData() {
        const body = document.getElementById('adminModalBody');
        body.innerHTML = '<div class="admin-loading"><i class="fas fa-spinner"></i><p>Yükleniyor...</p></div>';

        try {
                    // DEBUG: Tüm ürünleri kontrol et
        const allProducts = await productsRef.get();
        console.log('Toplam ürün sayısı:', allProducts.size);
        allProducts.forEach(doc => {
            console.log('Ürün:', doc.id, doc.data());
        });
            const categoriesSnapshot = await categoriesRef.get();

            if (categoriesSnapshot.empty) {
                body.innerHTML = '<p style="text-align:center;color:#D4A017;padding:40px;">Henüz kategori yok. Yeni kategori ekleyin!</p>';
                renderAddCategoryButton(body);
                return;
            }
            let html = '';

            for (const categoryDoc of categoriesSnapshot.docs) {
                const category = categoryDoc.data();
                const categoryId = categoryDoc.id;

                html += `
                    <div class="admin-category">
                        <div class="admin-category-header">
                            <span class="admin-category-name">${category.name || categoryId}</span>
                            <div class="admin-btn-group">
                                <button class="admin-edit-category-btn" onclick="editCategory('${categoryId}')">
                                    <i class="fas fa-edit"></i> Düzenle
                                </button>
                                <button class="admin-delete-category-btn" onclick="deleteCategory('${categoryId}')">
                                    <i class="fas fa-trash"></i> Sil
                                </button>
                            </div>
                        </div>
                `;

                // Tüm ürünleri çek
const productsSnapshot = await productsRef.get();

                if (productsSnapshot.empty) {
                    html += '<p style="color:#888;padding:10px;">Bu kategoride ürün yok</p>';
                } else {
                    for (const productDoc of productsSnapshot.docs) {
    const product = productDoc.data();
    const productId = productDoc.id;
    
    // category yoksa veya farklıysa atla
if (product.category !== categoryId) continue;

                        html += `
                            <div class="admin-product-item">
                                <img src="${product.image || 'https://via.placeholder.com/50?text=No+Image'}" alt="${product.name}" class="admin-product-img" onerror="this.src='https://via.placeholder.com/50?text=No+Image'">
                                <div class="admin-product-info">
                                    <h4>${product.name}</h4>
                                    <p>${product.price || '—'} ${product.calories ? '• ' + product.calories : ''}</p>
                                </div>
                                <div class="admin-product-actions">
                                    <button class="admin-edit-product-btn" onclick="editProduct('${categoryId}', '${productId}')">
                                        <i class="fas fa-edit"></i> Düzenle
                                    </button>
                                    <button class="admin-delete-product-btn" onclick="deleteProduct('${categoryId}', '${productId}')">
                                        <i class="fas fa-trash"></i> Sil
                                    </button>
                                </div>
                            </div>
                        `;
                    }
                }

                html += `
                        <button class="admin-add-product-btn" onclick="addProduct('${categoryId}')">
                            <i class="fas fa-plus"></i> Ürün Ekle
                        </button>
                    </div>
                `;
            }

            body.innerHTML = html;
            renderAddCategoryButton(body);

        } catch (error) {
            console.error('Hata:', error);
            body.innerHTML = '<p style="text-align:center;color:#ef4444;padding:40px;">Hata: ' + error.message + '</p>';
        }
    }

    function renderAddCategoryButton(container) {
        container.innerHTML += `
            <button class="admin-add-category-btn" onclick="addCategory()">
                <i class="fas fa-plus-circle"></i> Yeni Kategori Ekle
            </button>
        `;
    }

    // ============ KATEGORİ İŞLEMLERİ ============
    function addCategory() {
        currentEditType = 'addCategory';
        document.getElementById('editModalTitle').textContent = 'Yeni Kategori Ekle';
        document.getElementById('editModalBody').innerHTML = `
            <div class="edit-form-group">
                <label>Kategori Adı (emoji ile birlikte yazabilirsiniz)</label>
                <input type="text" id="editCategoryName" placeholder="Örn: 🥙 Kokoreç">
            </div>
        `;
        document.getElementById('editModal').classList.add('active');
    }

    async function editCategory(categoryId) {
        try {
            const doc = await categoriesRef.doc(categoryId).get();
            const category = doc.data();
            currentEditType = 'editCategory';
            currentEditData = { categoryId };
            document.getElementById('editModalTitle').textContent = 'Kategori Düzenle';
            document.getElementById('editModalBody').innerHTML = `
                <div class="edit-form-group">
                    <label>Kategori Adı</label>
                    <input type="text" id="editCategoryName" value="${category.name || ''}">
                </div>
            `;
            document.getElementById('editModal').classList.add('active');
        } catch (error) {
            showMessage('Hata: ' + error.message, 'error');
        }
    }

    async function deleteCategory(categoryId) {
        if (confirm('Bu kategoriyi ve içindeki tüm ürünleri silmek istediğinize emin misiniz?')) {
            try {
                const productsSnapshot = await productsRef.where('category', '==', categoryId).get();
                const batch = db.batch();
                productsSnapshot.forEach(doc => { batch.delete(doc.ref); });
                await batch.commit();
                await categoriesRef.doc(categoryId).delete();
                showMessage('Kategori ve ürünler silindi!', 'success');
                loadAdminData();
            } catch (error) {
                showMessage('Hata: ' + error.message, 'error');
            }
        }
    }

    // ============ ÜRÜN İŞLEMLERİ ============
    function addProduct(categoryId) {
        currentEditType = 'addProduct';
        currentEditData = { categoryId };
        document.getElementById('editModalTitle').textContent = 'Yeni Ürün Ekle';
        document.getElementById('editModalBody').innerHTML = `
            <div class="edit-form-group">
                <label>Ürün Adı</label>
                <input type="text" id="editProductName" placeholder="Örn: Kokoreç">
            </div>
            <div class="edit-form-group">
                <label>Açıklama</label>
                <input type="text" id="editProductDesc" placeholder="Örn: Özel baharatlarla hazırlanan">
            </div>
            <div class="edit-form-group">
                <label>Fiyat</label>
                <input type="text" id="editProductPrice" placeholder="Örn: 500 TL">
            </div>
            <div class="edit-form-group">
                <label>Kalori</label>
                <input type="text" id="editProductCalories" placeholder="Örn: 650 kcal">
            </div>
            <div class="edit-form-group">
                <label>Görsel URL</label>
                <input type="text" id="editProductImage" placeholder="https://...">
            </div>
        `;
        document.getElementById('editModal').classList.add('active');
    }

    async function editProduct(categoryId, productId) {
        try {
            const doc = await productsRef.doc(productId).get();
            const product = doc.data();
            currentEditType = 'editProduct';
            currentEditData = { categoryId, productId };
            document.getElementById('editModalTitle').textContent = 'Ürün Düzenle';
            document.getElementById('editModalBody').innerHTML = `
                <div class="edit-form-group">
                    <label>Ürün Adı</label>
                    <input type="text" id="editProductName" value="${product.name || ''}">
                </div>
                <div class="edit-form-group">
                    <label>Açıklama</label>
                    <input type="text" id="editProductDesc" value="${product.description || ''}">
                </div>
                <div class="edit-form-group">
                    <label>Fiyat</label>
                    <input type="text" id="editProductPrice" value="${product.price || ''}">
                </div>
                <div class="edit-form-group">
                    <label>Kalori</label>
                    <input type="text" id="editProductCalories" value="${product.calories || ''}">
                </div>
                <div class="edit-form-group">
                    <label>Görsel URL</label>
                    <input type="text" id="editProductImage" value="${product.image || ''}">
                </div>
            `;
            document.getElementById('editModal').classList.add('active');
        } catch (error) {
            showMessage('Hata: ' + error.message, 'error');
        }
    }

    async function deleteProduct(categoryId, productId) {
        if (confirm('Bu ürünü silmek istediğinize emin misiniz?')) {
            try {
                await productsRef.doc(productId).delete();
                showMessage('Ürün silindi!', 'success');
                loadAdminData();
            } catch (error) {
                showMessage('Hata: ' + error.message, 'error');
            }
        }
    }

    // ============ KAYDETME ============
    async function saveEdit() {
        try {
            if (currentEditType === 'addCategory') {
                const name = document.getElementById('editCategoryName').value.trim();
                if (!name) { showMessage('Kategori adı boş olamaz!', 'error'); return; }
                await categoriesRef.add({
                    name,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                showMessage('Kategori eklendi!', 'success');
                closeEditModal();
                loadAdminData();
            }
            else if (currentEditType === 'editCategory') {
                const name = document.getElementById('editCategoryName').value.trim();
                if (!name) { showMessage('Kategori adı boş olamaz!', 'error'); return; }
                await categoriesRef.doc(currentEditData.categoryId).update({ name });
                showMessage('Kategori güncellendi!', 'success');
                closeEditModal();
                loadAdminData();
            }
            else if (currentEditType === 'addProduct') {
                const name = document.getElementById('editProductName').value.trim();
                const price = document.getElementById('editProductPrice').value.trim();
                if (!name || !price) { showMessage('Ürün adı ve fiyat zorunludur!', 'error'); return; }
                await productsRef.add({
                    categoryId: currentEditData.categoryId,
                    name,
                    description: document.getElementById('editProductDesc').value.trim(),
                    price,
                    calories: document.getElementById('editProductCalories').value.trim(),
                    image: document.getElementById('editProductImage').value.trim(),
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                showMessage('Ürün eklendi!', 'success');
                closeEditModal();
                loadAdminData();
            }
            else if (currentEditType === 'editProduct') {
                await productsRef.doc(currentEditData.productId).update({
                    name: document.getElementById('editProductName').value.trim(),
                    description: document.getElementById('editProductDesc').value.trim(),
                    price: document.getElementById('editProductPrice').value.trim(),
                    calories: document.getElementById('editProductCalories').value.trim(),
                    image: document.getElementById('editProductImage').value.trim()
                });
                showMessage('Ürün güncellendi!', 'success');
                closeEditModal();
                loadAdminData();
            }
        } catch (error) {
            showMessage('Hata: ' + error.message, 'error');
        }
    }

    function closeEditModal() {
        document.getElementById('editModal').classList.remove('active');
        currentEditType = '';
        currentEditData = {};
    }

    // ============ MESAJ ============
    function showMessage(text, type) {
        const msg = document.getElementById('adminSuccessMsg');
        const msgText = document.getElementById('adminMsgText');
        msg.className = 'admin-success-msg ' + type;
        msgText.textContent = text;
        msg.style.display = 'block';
        setTimeout(() => { msg.style.display = 'none'; }, 3000);
    }

    // ============ EVENT LISTENERS ============
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            closeEditModal();
            closeAdminPanel();
            document.getElementById('loginModal').classList.remove('active');
        }
    });

    document.getElementById('editModal').addEventListener('click', (e) => {
        if (e.target.id === 'editModal') closeEditModal();
    });
    document.getElementById('adminModal').addEventListener('click', (e) => {
        if (e.target.id === 'adminModal') closeAdminPanel();
    });
    document.getElementById('loginModal').addEventListener('click', (e) => {
        if (e.target.id === 'loginModal') document.getElementById('loginModal').classList.remove('active');
    });
</script>
<!-- ============ FIRESTORE ADMIN PANELİ BİTİŞ ============ -->
</body>
</html>
